<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111318"><link rel="icon" type="image/png" href="assets/zyma-symbol.png"><link rel="stylesheet" href="client-auth.css"><title>Set a New Password | Zyma Systems</title></head>
<body class="client-login-page"><main class="auth-shell"><section class="auth-story" aria-label="Zyma Systems Client Portal"><img class="auth-full-logo" src="assets/zyma-systems-logo-full.png" alt="Zyma Systems"><div class="story-copy"><span class="eyebrow">ACCOUNT SECURITY</span><h1>Choose a new password.</h1><p>Set a new password to regain access to your client workspace.</p></div><div class="story-foot"><span>Client Portal</span><span>·</span><span>Secure access</span></div></section><section class="auth-panel"><div class="auth-panel-inner"><img class="auth-symbol" src="assets/zyma-symbol.png" alt="Zyma Systems symbol"><span class="eyebrow">PASSWORD RESET</span><h2>Set a new password</h2><p class="muted">Use the secure reset link sent to your email address.</p><form id="client-new-password-form" novalidate><label for="new-password">New password</label><div class="password-wrap"><input id="new-password" name="password" type="password" minlength="12" autocomplete="new-password" required placeholder="At least 12 characters"><button class="show-password" type="button" data-toggle-password="new-password">Show</button></div><label for="confirm-new-password">Confirm new password</label><input id="confirm-new-password" name="confirmPassword" type="password" minlength="12" autocomplete="new-password" required placeholder="Re-enter your password"><div class="auth-message" id="new-password-message" role="status" aria-live="polite"></div><button class="primary-btn" type="submit"><span>Update password</span><span aria-hidden="true">→</span></button></form><p class="auth-help"><a href="client-login.html">← Back to sign in</a></p><div class="auth-secure"><span class="secure-dot"></span> Secure account recovery</div></div></section></main><script src="client-auth.js"></script></body></html>
